<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!--
    The Cetele mark, on the v4 Youth Nexus palette (blue + orange).

    v4: the arcs run Youth Nexus blue to YN navy (the token ramp's primary,
    800 and 900 tones); the lighter arc is primary-500 to 400. The accent runs
    the two YN oranges (#f0632e to #f09a3e) out to accent-200. The v3 note
    still applies: this is the fixed-colour brand asset, it does NOT read design
    tokens and does not flip with the theme.
    Re-run `node scripts/gen-icons.mjs` AND `node scripts/gen-splash.mjs` after
    touching this file, and bump CACHE in public/sw.js.
  -->
  <defs>
    <linearGradient id="ceteleGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0163ad" />
      <stop offset="50%" stop-color="#014a83" />
      <stop offset="100%" stop-color="#00335d" />
    </linearGradient>
    <linearGradient id="ceteleLightGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d7cd4" />
      <stop offset="100%" stop-color="#3698f1" />
    </linearGradient>
    <linearGradient id="ceteleRose" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0632e" />
      <stop offset="50%" stop-color="#f09a3e" />
      <stop offset="100%" stop-color="#fbb26a" />
    </linearGradient>
    <filter id="ceteleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-opacity="0.3" />
    </filter>
  </defs>

  <path d="M 440,160
           L 440,360
           A 120,120 0 0,1 320,480
           L 192,480
           A 160,160 0 0,1 32,320
           L 32,192
           A 160,160 0 0,1 192,32
           L 340,32
           A 40,40 0 0,1 370,60
           L 320,130
           A 40,40 0 0,0 290,120
           L 192,120
           A 72,72 0 0,0 120,192
           L 120,320
           A 72,72 0 0,0 192,392
           L 320,392
           A 40,40 0 0,0 360,352
           L 360,240 Z"
        fill="url(#ceteleGreen)" />

  <path d="M 32,192
           A 160,160 0 0,1 192,32
           L 340,32
           L 320,130
           L 192,120
           A 72,72 0 0,0 120,192 Z"
        fill="url(#ceteleLightGreen)" opacity="0.85" />

  <polygon points="260,255 375,180 470,60 380,45"
           fill="url(#ceteleRose)"
           filter="url(#ceteleShadow)" />

  <polygon points="260,255 380,45 325,120"
           fill="#f09a3e" opacity="0.6" />
</svg>
