name: CI

# Runs on every push to ANY branch (solo branch-per-issue workflow, D16 —
# branch pushes are the backstop; PRs are ad-hoc so we don't double-run on them).
on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks + app build (no backend needed)
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm (version comes from the "packageManager" field in package.json)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Lint (token contract + Next rules)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # Public, build-inlined Supabase vars — NOT secrets (they ship to the
          # browser; RLS protects the data, same values stack-tests hardcodes).
          # `NEXT_PUBLIC_*` is baked in at build, and `/` statically prerenders a
          # browser client, so the build needs *some* value present or it throws
          # ("URL and API key are required"). This job only typechecks/compiles
          # the bundle, so a placeholder is fine — every real build (Vercel prod/
          # preview) injects the true values.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH

  # Boots the real local Supabase stack:
  #  1. migration replay + seed on a fresh Postgres (the IaC reproducibility gate)
  #  2. pgTAP RLS/grants suite (supabase/tests)
  #  3. Playwright e2e against the prod build (sign-in is minted with the
  #     service role — no SMTP, no Mailpit; see e2e/helpers.ts)
  stack-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase stack (fresh migration replay + seed)
        # `supabase start` intermittently fails to bind a container port on the
        # GitHub runner (a Docker-networking race — seen as inbucket's
        # `0.0.0.0:54324 address already in use`). It's non-deterministic: the
        # same commit passes on a branch run and fails on main. Retry with a full
        # teardown between attempts so a half-started stack can't keep the port.
        run: |
          for attempt in 1 2 3; do
            if supabase start -x studio,imgproxy,vector,logflare; then
              echo "Supabase stack up (attempt $attempt)."
              exit 0
            fi
            echo "::warning::supabase start failed on attempt $attempt — tearing down and retrying"
            supabase stop --no-backup || true
            sleep 5
          done
          echo "::error::supabase start failed after 3 attempts"
          exit 1

      - name: RLS + grants tests (pgTAP)
        run: supabase test db

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Well-known shared local-dev keys (identical on every machine — not secrets)
      - name: Point the app at the CI stack
        run: |
          cat > .env.local <<'EOF'
          NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
          NEXT_PUBLIC_AUTH_EMAIL=1
          # Two specs (auth, manage's signed-out invite → ?next= → sign-in) drive
          # the REAL login UI rather than the helper, because the redirect and the
          # cookie are what they assert — and that button is gated on this flag.
          # It is build-inlined, so it has to be set before `pnpm build` below;
          # production never sets it, so the button cannot appear there.
          NEXT_PUBLIC_AUTH_DEV=1
          EOF
          # e2e sign-in mints its own magic link with the SERVICE ROLE instead of
          # sending email (e2e/helpers.ts), so the suite needs that key as well —
          # without it every signing-in spec dies at helpers.ts, which is what
          # happened here for days while local runs stayed green off .env.local.
          # Read from the running stack rather than pasted: the CLI names it
          # SERVICE_ROLE_KEY, the app wants SUPABASE_SERVICE_ROLE_KEY, and a
          # pasted key would rot silently the next time the CLI rotates its
          # local demo credentials.
          key=$(supabase status -o env | sed -n 's/^SERVICE_ROLE_KEY=//p' | tr -d '"')
          if [ -z "$key" ]; then
            echo "::error::could not read SERVICE_ROLE_KEY from the local stack"
            exit 1
          fi
          echo "SUPABASE_SERVICE_ROLE_KEY=$key" >> .env.local

      - name: Build
        run: pnpm build

      - name: E2E (Playwright)
        run: pnpm test:e2e
